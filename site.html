<title>Rhode Island Computer Museum</title>
<style>
/* ==========================================================================
   RICM WEBSITE PROTOTYPE — DESIGN SYSTEM
   Palette and type are drawn from Section 5 of the RICM Website Design &
   Experience Specification (canonical hex table), which this project's
   source-of-truth order ranks above the earlier high-fidelity mockup
   images. Typefaces: Sora (display) + Inter (body/UI) per spec; IBM Plex
   Mono is added, used sparingly, for object IDs / specs / session codes —
   a restrained nod to computing heritage, never for interface text.

   THEME NOTE: every approved reference shows a fixed light-content /
   deep-navy-chrome museum identity, not a utility app. This is a
   deliberate single-theme brand commitment, not an omission — colors are
   explicit tokens throughout and body background is always painted.
   ========================================================================== */

@import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  /* --- Brand palette (canonical, Spec Sec.5) --- */
  --navy:        #0E1A28;
  --navy-800:    #16283b;
  --navy-700:    #1e3550;
  --blue:        #1168E5;
  --blue-dark:   #0d51b8;
  --teal:        #00C2B2;
  --teal-dark:   #00746a;
  --purple:      #7C3AED;
  --purple-dark: #6427c9;
  --orange:      #FF8A00;
  --orange-dark: #a55900;
  --slate:       #33383F;
  --warm-gray:   #F5F6F7;
  --white:       #FFFFFF;

  /* neutrals derived w/ a cool bias, not pure grey */
  --line:        #DDE2E8;
  --line-strong: #C4CBD4;
  --ink-soft:    #5B6472;
  --surface-2:   #ECEFF2;
  --navy-tint:   #EAF0FB;

  /* semantic (status only — never the accent system, always paired w/ text) */
  --status-good:   #0F6B31;
  --status-good-bg:#E4F5EA;
  --status-warn:   #9A5B00;
  --status-warn-bg:#FFF1DC;
  --status-bad:    #B3261E;
  --status-bad-bg: #FBE8E7;
  --status-info-bg:#E9EEFB;

  /* type */
  --f-display: 'Sora', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --f-body:    'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --f-mono:    'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;

  /* fluid type scale */
  --fs-xs:   0.8125rem;
  --fs-sm:   0.9375rem;
  --fs-base: 1rem;
  --fs-md:   1.125rem;
  --fs-lg:   clamp(1.25rem, 1.1rem + 0.6vw, 1.5rem);
  --fs-xl:   clamp(1.5rem, 1.3rem + 1vw, 2rem);
  --fs-2xl:  clamp(1.9rem, 1.5rem + 1.8vw, 2.75rem);
  --fs-3xl:  clamp(2.4rem, 1.8rem + 2.8vw, 3.75rem);

  --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem;
  --space-4: 1rem; --space-5: 1.5rem; --space-6: 2rem;
  --space-7: 2.5rem; --space-8: 3.5rem; --space-9: 5rem; --space-10: 7rem;

  --radius-sm: 6px; --radius-md: 10px; --radius-lg: 16px; --radius-pill: 999px;
  --shadow-sm: 0 1px 2px rgba(14,26,40,0.08), 0 1px 1px rgba(14,26,40,0.04);
  --shadow-md: 0 8px 24px rgba(14,26,40,0.12);
  --shadow-lg: 0 16px 48px rgba(14,26,40,0.22);

  --container: 1320px;
  --content-measure: 68ch;
  --header-h: 84px;
  --header-h-compact: 64px;
  --focus-ring: 0 0 0 3px #FFFFFF, 0 0 0 5.5px var(--blue);
  --focus-ring-dark: 0 0 0 3px var(--navy), 0 0 0 5.5px var(--teal);

  --dur-fast: 120ms; --dur-med: 220ms; --dur-slow: 380ms;
  --ease: cubic-bezier(.4,0,.2,1);

  color-scheme: light;
  background: var(--white);
}

@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}

/* ---------- Reset / base ---------- */
*,*::before,*::after{ box-sizing: border-box; }
html{ -webkit-text-size-adjust: 100%; scroll-behavior: smooth; overflow-x: hidden; }
body{
  margin:0; background: var(--white); color: var(--slate);
  font-family: var(--f-body); font-size: var(--fs-base); line-height: 1.55;
  -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
img{ max-width:100%; display:block; }
svg{ display:block; }
h1,h2,h3,h4{ font-family: var(--f-display); color: var(--navy); line-height:1.15; margin:0; text-wrap: balance; font-weight:700; }
h1{ font-size: var(--fs-3xl); font-weight:800; letter-spacing:-0.01em; }
h2{ font-size: var(--fs-2xl); font-weight:800; letter-spacing:-0.01em; }
h3{ font-size: var(--fs-xl); font-weight:700; }
h4{ font-size: var(--fs-md); font-weight:700; }
p{ margin:0 0 1em; }
p:last-child{ margin-bottom:0; }
a{ color: var(--blue); text-decoration-color: rgba(17,104,229,0.35); text-underline-offset:0.15em; }
a:hover{ text-decoration-color: currentColor; }
ul,ol{ margin:0; padding:0; list-style:none; }
button{ font-family: inherit; }
input,select,textarea{ font-family: inherit; font-size: inherit; }
table{ border-collapse: collapse; width:100%; }
:focus{ outline:none; }
:focus-visible{ outline:none; box-shadow: var(--focus-ring); border-radius: 4px; }
.on-dark :focus-visible, [data-surface="dark"] :focus-visible{ box-shadow: var(--focus-ring-dark); }
::selection{ background: var(--teal); color: var(--navy); }

.visually-hidden{
  position:absolute !important; width:1px; height:1px; padding:0; margin:-1px;
  overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
}

.skip-link{
  position:absolute; left:1rem; top:-4rem; background:var(--navy); color:var(--white);
  padding:.85rem 1.25rem; border-radius: var(--radius-sm); z-index:1000; font-weight:600;
  transition: top var(--dur-fast) var(--ease);
}
.skip-link:focus{ top:1rem; box-shadow: var(--focus-ring-dark); }

.container{ max-width: var(--container); margin-inline:auto; padding-inline: clamp(1.25rem, 2vw + 0.5rem, 2.5rem); }
.measure{ max-width: var(--content-measure); }

section{ position:relative; }
.section-pad{ padding-block: var(--space-9); }
.section-pad-sm{ padding-block: var(--space-8); }
@media (max-width: 767px){
  .section-pad{ padding-block: var(--space-7); }
  .section-pad-sm{ padding-block: var(--space-6); }
}

.bg-white{ background: var(--white); }
.bg-warm{ background: var(--warm-gray); }
.bg-navy{ background: var(--navy); color:#DDE6F5; }
.bg-navy h1,.bg-navy h2,.bg-navy h3,.bg-navy h4{ color: var(--white); }
.bg-navy a:not(.btn){ color:#8FC1FF; }

.eyebrow{
  display:inline-flex; align-items:center; gap:.5em; font-family: var(--f-body); font-weight:700;
  font-size: var(--fs-xs); letter-spacing:0.09em; text-transform:uppercase; color: var(--blue);
}
.bg-navy .eyebrow{ color: var(--teal); }
.eyebrow.c-purple{ color: var(--purple); }
.eyebrow.c-orange{ color: var(--orange-dark); }
.eyebrow.c-teal{ color: var(--teal-dark); }
.bg-navy .eyebrow.c-purple{ color:#C4A6FF; }
.bg-navy .eyebrow.c-orange{ color:#FFC46B; }

.lede{ font-size: var(--fs-md); color: var(--ink-soft); }
.bg-navy .lede{ color:#B9C6DA; }

.section-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:var(--space-5); margin-bottom: var(--space-6); flex-wrap:wrap; }
.section-head h2{ margin-top:.35em; }
.section-title-group > *+*{ margin-top:.5em; }

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:.5em;
  font-family: var(--f-body); font-weight:700; font-size: var(--fs-sm);
  padding: 0.85em 1.4em; border-radius: var(--radius-md); border:2px solid transparent;
  cursor:pointer; text-decoration:none; line-height:1.2; min-height:44px;
  transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
  white-space:nowrap;
}
.btn:active{ transform: translateY(1px); }
.btn svg{ width:1.05em; height:1.05em; flex:none; }
.btn-primary{ background: var(--navy); color:var(--white); border-color:var(--navy); }
.btn-primary:hover{ background:#08131f; border-color:#08131f; color:var(--white); text-decoration:none; }
.btn-teal{ background: var(--teal); color:#00291F; border-color: var(--teal); }
.btn-teal:hover{ background: var(--teal-dark); border-color:var(--teal-dark); color:#fff; text-decoration:none; }
.btn-outline{ background:transparent; color: var(--navy); border-color: var(--navy); }
.btn-outline:hover{ background: var(--navy); color:#fff; text-decoration:none; }
.bg-navy .btn-outline{ color:#fff; border-color:#fff; }
.bg-navy .btn-outline:hover{ background:#fff; color:var(--navy); }
.btn-ghost{ background:transparent; color: var(--blue); border-color:transparent; padding-inline:.6em; }
.btn-ghost:hover{ background: var(--navy-tint); text-decoration:none; }
.btn-danger-outline{ background:transparent; color:var(--status-bad); border-color:var(--status-bad); }
.btn-sm{ padding:.55em 1em; font-size:var(--fs-xs); min-height:36px; }
.btn-block{ width:100%; }
.btn[disabled], .btn[aria-disabled="true"]{ opacity:.5; cursor:not-allowed; pointer-events:none; }
.btn-icon{ width:44px; height:44px; padding:0; border-radius: var(--radius-pill); }

.text-link{ display:inline-flex; align-items:center; gap:.35em; font-weight:700; color:var(--blue); }
.text-link svg{ width:1em; height:1em; transition: transform var(--dur-fast) var(--ease); }
.text-link:hover svg{ transform: translateX(3px); }

/* ---------- Pills / chips / badges ---------- */
.pill{
  display:inline-flex; align-items:center; gap:.4em; font-size: var(--fs-xs); font-weight:600;
  padding:.42em .9em; border-radius: var(--radius-pill); border:1.5px solid var(--line-strong);
  background:#fff; color:var(--slate); cursor:pointer; min-height:36px; white-space:nowrap;
  transition: all var(--dur-fast) var(--ease);
}
.pill:hover{ border-color: var(--blue); }
.pill[aria-pressed="true"]{ background: var(--navy); border-color:var(--navy); color:#fff; }
.pill svg{ width:1.05em; height:1.05em; }

.tag{ display:inline-flex; align-items:center; font-size:var(--fs-xs); font-weight:700; letter-spacing:.03em; text-transform:uppercase; padding:.3em .65em; border-radius:5px; }
.tag-navy{ background:var(--navy-tint); color:var(--blue-dark); }
.tag-purple{ background:#F1E9FE; color:var(--purple-dark); }
.tag-orange{ background:#FFF0DC; color:var(--orange-dark); }
.tag-teal{ background:#E1F8F5; color:var(--teal-dark); }

.chip{
  display:inline-flex; align-items:center; gap:.5em; font-size: var(--fs-xs); font-weight:600;
  background: var(--navy-tint); color: var(--navy); padding:.4em .55em .4em 1em; border-radius: var(--radius-pill);
  border:1px solid #cfe0fa;
}
.chip button{ background:none; border:none; cursor:pointer; color:var(--blue-dark); display:flex; padding:.3em; border-radius:50%; }
.chip button:hover{ background:#cfe0fa; }
.chip button svg{ width:14px; height:14px; }

.status-badge{ display:inline-flex; align-items:center; gap:.45em; font-size:var(--fs-xs); font-weight:700; padding:.4em .8em; border-radius: var(--radius-pill); }
.status-badge svg{ width:14px; height:14px; flex:none; }
.status-badge.is-open{ background: var(--status-good-bg); color: var(--status-good); }
.status-badge.is-limited{ background: var(--status-warn-bg); color: var(--status-warn); }
.status-badge.is-full{ background: var(--status-bad-bg); color: var(--status-bad); }
.status-badge.is-waitlist{ background:#EFE6FE; color:var(--purple-dark); }
.status-badge.is-closed{ background: var(--surface-2); color: var(--ink-soft); }
.status-badge.is-ondisplay{ background: var(--status-good-bg); color: var(--status-good); }
.status-badge.is-archive{ background: var(--surface-2); color: var(--ink-soft); }

/* ---------- Forms ---------- */
.field{ display:flex; flex-direction:column; gap:.4em; }
.field label,.field legend{ font-weight:700; font-size: var(--fs-sm); color: var(--navy); padding:0; }
.field .hint{ font-size: var(--fs-xs); color: var(--ink-soft); }
.input,.select,.textarea{
  border:1.5px solid var(--line-strong); border-radius: var(--radius-md); padding:.8em 1em;
  background:#fff; color:var(--slate); min-height:44px; width:100%;
}
.textarea{ min-height:110px; resize:vertical; }
.input:focus-visible,.select:focus-visible,.textarea:focus-visible{ border-color:var(--blue); }
.field.has-error .input,.field.has-error .select{ border-color: var(--status-bad); }
.error-msg{ display:flex; align-items:flex-start; gap:.4em; color: var(--status-bad); font-size: var(--fs-xs); font-weight:600; }
.error-msg svg{ width:14px; height:14px; flex:none; margin-top:.15em; }
fieldset{ border:none; padding:0; margin:0; }
.check-row{ display:flex; align-items:flex-start; gap:.65em; font-size:var(--fs-sm); }
.check-row input[type=checkbox],.check-row input[type=radio]{ width:20px; height:20px; margin-top:.1em; accent-color: var(--blue); flex:none; }
.search-field{ position:relative; }
.search-field input{ padding-left:2.9em; }
.search-field svg{ position:absolute; left:1em; top:50%; transform:translateY(-50%); width:20px; height:20px; color: var(--ink-soft); pointer-events:none; }

/* ---------- Header / Nav ---------- */
.site-header{
  position:sticky; top:0; z-index:200; background: var(--navy); border-bottom:1px solid rgba(255,255,255,.08);
  transition: padding var(--dur-med) var(--ease);
}
.header-inner{ display:flex; align-items:center; gap: var(--space-6); height: var(--header-h); transition: height var(--dur-med) var(--ease); }
.site-header.is-compact .header-inner{ height: var(--header-h-compact); }
.brand{ display:flex; align-items:center; gap:.7em; color:#fff; text-decoration:none; flex:none; }
.brand:hover{ text-decoration:none; }
.brand-mark{ width:40px; height:40px; flex:none; }
.brand-word{ font-family: var(--f-display); font-weight:800; font-size:1.15rem; line-height:1.05; letter-spacing:.01em; }
.brand-sub{ display:block; font-family: var(--f-body); font-weight:600; font-size:.62rem; letter-spacing:.09em; color:#9FB4CF; text-transform:uppercase; }

.primary-nav{ display:flex; align-items:center; gap:.2em; margin-inline:auto; }
.nav-item{ position:relative; }
.nav-link,.nav-trigger{
  display:flex; align-items:center; gap:.35em; background:none; border:none; cursor:pointer;
  color:#E7ECF4; font-weight:600; font-size:var(--fs-sm); padding:.9em 1em; border-radius: var(--radius-sm);
  text-decoration:none;
}
.nav-trigger svg{ width:16px; height:16px; transition: transform var(--dur-fast) var(--ease); }
.nav-link:hover,.nav-trigger:hover{ color:#fff; background:rgba(255,255,255,.08); text-decoration:none; }
.nav-item.is-active > .nav-link,.nav-item.is-current > .nav-trigger{ color:#fff; }
.nav-item.is-active > .nav-link::after,.nav-item.is-current > .nav-trigger::after{
  content:""; position:absolute; left:1em; right:1em; bottom:.35em; height:3px; border-radius:2px; background: var(--teal);
}
.nav-trigger[aria-expanded="true"] svg{ transform: rotate(180deg); }

.utility-actions{ display:flex; align-items:center; gap:.4em; flex:none; }
.icon-btn{
  display:inline-flex; align-items:center; justify-content:center; width:44px; height:44px;
  background:transparent; border:none; border-radius:50%; color:#fff; cursor:pointer;
}
.icon-btn:hover{ background:rgba(255,255,255,.1); }
.icon-btn svg{ width:22px; height:22px; }
.menu-toggle{ display:none; }

.mega{
  position:absolute; top:100%; left:50%; transform:translateX(-50%); width:min(920px,90vw);
  background:#fff; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); border:1px solid var(--line);
  padding: var(--space-6); margin-top:.6rem; z-index:210;
}
.mega-grid{ display:grid; grid-template-columns: repeat(3,1fr) 1.1fr; gap: var(--space-6); }
.mega-col h3{ font-size:var(--fs-xs); text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); font-family:var(--f-body); font-weight:700; margin-bottom:.9em; }
.mega-col ul li + li{ margin-top:.35em; }
.mega-col a{ color:var(--navy); font-weight:600; text-decoration:none; font-size:var(--fs-sm); display:block; padding:.35em 0; border-radius:4px; }
.mega-col a:hover{ color:var(--blue); }
.mega-feature{ background: var(--warm-gray); border-radius: var(--radius-md); overflow:hidden; text-decoration:none; color:var(--navy); display:block; border:1px solid var(--line); }
.mega-feature:hover{ text-decoration:none; }
.mega-feature img{ height:120px; width:100%; object-fit:cover; }
.mega-feature-body{ padding: var(--space-4); }
.mega-feature .eyebrow{ margin-bottom:.4em; }
.mega-feature strong{ display:block; font-family:var(--f-display); font-size:var(--fs-sm); margin-bottom:.3em; }
.mega-feature span.sub{ font-size:var(--fs-xs); color:var(--ink-soft); }

/* ---------- Mobile nav dialog ---------- */
.mobile-nav-panel{
  position:fixed; inset:0; background: var(--navy); z-index:400; display:flex; flex-direction:column;
  transform: translateX(100%); transition: transform var(--dur-med) var(--ease); visibility:hidden;
}
.mobile-nav-panel.is-open{ transform: translateX(0); visibility:visible; }
.mobile-nav-head{ display:flex; align-items:center; justify-content:space-between; padding: var(--space-4) 1.25rem; border-bottom:1px solid rgba(255,255,255,.1); flex:none; }
.mobile-nav-body{ overflow-y:auto; padding: var(--space-4) 1.25rem var(--space-8); flex:1; }
.mnav-section + .mnav-section{ margin-top:.4em; border-top:1px solid rgba(255,255,255,.08); }
.mnav-summary{ display:flex; align-items:center; justify-content:space-between; width:100%; background:none; border:none; color:#fff; font-family:var(--f-display); font-weight:700; font-size:1.15rem; padding:1.1em 0; cursor:pointer; text-align:left; min-height:44px; }
.mnav-summary svg{ width:20px; height:20px; transition: transform var(--dur-fast) var(--ease); flex:none; }
.mnav-summary[aria-expanded="true"] svg{ transform: rotate(180deg); }
.mnav-panel{ padding-bottom:1em; }
.mnav-panel a{ display:block; color:#CFE0FA; font-weight:500; font-size:1rem; padding:.7em 0 .7em .2em; text-decoration:none; min-height:44px; display:flex; align-items:center; }
.mnav-panel a:hover{ color:#fff; }
.mnav-top-link{ display:flex; align-items:center; min-height:44px; color:#fff; font-family:var(--f-display); font-weight:700; font-size:1.15rem; text-decoration:none; padding:1.1em 0; }
.mnav-cta{ margin-top: var(--space-6); display:flex; flex-direction:column; gap: var(--space-3); }

/* ---------- Search overlay ---------- */
.search-overlay{
  position:fixed; inset:0; background:rgba(9,15,24,.72); backdrop-filter: blur(2px); z-index:500;
  display:flex; align-items:flex-start; justify-content:center; padding:6vh 1.25rem; opacity:0; visibility:hidden;
  transition: opacity var(--dur-med) var(--ease);
}
.search-overlay.is-open{ opacity:1; visibility:visible; }
.search-panel{ background:#fff; width:min(760px,100%); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); overflow:hidden; max-height:86vh; display:flex; flex-direction:column; }
.search-panel-head{ display:flex; align-items:center; gap: var(--space-3); padding: var(--space-5); border-bottom:1px solid var(--line); }
.search-panel-head .search-field{ flex:1; }
.search-panel-body{ padding: var(--space-5); overflow-y:auto; }
.search-quick a{ display:inline-flex; }
.search-group + .search-group{ margin-top: var(--space-5); }
.search-group h3{ font-size:var(--fs-xs); text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); font-weight:700; margin-bottom:.7em; }
.search-result-row{ display:flex; align-items:center; gap: var(--space-3); padding:.6em .5em; border-radius: var(--radius-sm); text-decoration:none; color:var(--navy); }
.search-result-row:hover,.search-result-row:focus-visible{ background:var(--warm-gray); text-decoration:none; }
.search-result-row .thumb{ width:48px; height:48px; border-radius:8px; background:var(--surface-2); object-fit:cover; flex:none; }
.search-result-row .meta{ font-size:var(--fs-xs); color:var(--ink-soft); }
.popular-search-list{ display:flex; flex-wrap:wrap; gap:.5em; }

/* ---------- Hero ---------- */
.hero{ position:relative; color:#fff; overflow:hidden; background: var(--navy); }
.hero-media{ position:absolute; inset:0; z-index:0; }
.hero-media img{ width:100%; height:100%; object-fit:cover; opacity:.55; }
.hero-media::after{ content:""; position:absolute; inset:0; background: linear-gradient(105deg, rgba(14,26,40,.97) 0%, rgba(14,26,40,.88) 38%, rgba(14,26,40,.35) 78%); }
.hero-inner{ position:relative; z-index:1; padding-block: var(--space-9); display:grid; grid-template-columns: 1.1fr .9fr; gap:var(--space-8); align-items:center; }
.hero-inner.split-narrow{ grid-template-columns:1fr; max-width:820px; }
.hero-inner.split-wide{ grid-template-columns: minmax(0,1.3fr) minmax(0,.8fr); }
.hero-eyebrow{ color:var(--teal); }
.hero h1{ margin-top:.5em; color:#fff; }
.hero .lede{ margin-top: var(--space-4); color:#C6D3E6; max-width:46ch; }
.hero-ctas{ display:flex; gap: var(--space-3); flex-wrap:wrap; margin-top: var(--space-6); }
.hero-art{ border-radius: var(--radius-lg); overflow:hidden; box-shadow: var(--shadow-lg); }
.hero-art img{ width:100%; aspect-ratio:4/3; object-fit:cover; }
.hero.compact .hero-inner{ padding-block: var(--space-8) var(--space-7); grid-template-columns:1fr; max-width:900px; }
.hero.short .hero-inner{ padding-block: var(--space-8); }

.breadcrumb{ display:flex; flex-wrap:wrap; align-items:center; gap:.4em; font-size:var(--fs-xs); color:#B9C6DA; margin-bottom:var(--space-4); }
.breadcrumb a{ color:#B9C6DA; text-decoration:none; font-weight:600; }
.breadcrumb a:hover{ color:#fff; text-decoration:underline; }
.breadcrumb svg{ width:12px; height:12px; opacity:.6; }
.breadcrumb[data-on="light"]{ color: var(--ink-soft); }
.breadcrumb[data-on="light"] a{ color: var(--ink-soft); }
.breadcrumb[data-on="light"] a:hover{ color: var(--blue); }
.breadcrumb li{ display:flex; align-items:center; gap:.4em; }
.breadcrumb ol{ display:flex; flex-wrap:wrap; gap:.4em; }

/* ---------- Practical info strip ---------- */
.info-strip{ background:#fff; border-bottom:1px solid var(--line); }
.info-strip .container{ display:grid; grid-template-columns:repeat(3,1fr); gap:var(--space-6); padding-block: var(--space-6); }
.info-block{ display:flex; gap: var(--space-3); }
.info-icon{ width:44px; height:44px; border-radius:50%; background: var(--navy-tint); color:var(--blue); display:flex; align-items:center; justify-content:center; flex:none; }
.info-icon svg{ width:22px; height:22px; }
.info-block h3{ font-size:var(--fs-xs); text-transform:uppercase; letter-spacing:.07em; color:var(--ink-soft); font-family:var(--f-body); font-weight:700; margin-bottom:.3em; }
.info-block .info-main{ font-family:var(--f-display); font-weight:700; font-size:var(--fs-md); color:var(--navy); }
.info-block .info-sub{ font-size:var(--fs-sm); color:var(--ink-soft); margin-top:.15em; }
.next-event-card{ display:flex; gap: var(--space-3); align-items:center; }
.date-chip{ flex:none; width:52px; text-align:center; border:1.5px solid var(--line-strong); border-radius:8px; overflow:hidden; }
.date-chip .mo{ background:var(--navy); color:#fff; font-size:.62rem; font-weight:800; letter-spacing:.05em; padding:.2em 0; text-transform:uppercase; }
.date-chip .dd{ font-family:var(--f-display); font-weight:800; font-size:1.15rem; padding:.15em 0; color:var(--navy); }

/* ---------- Start-here cards ---------- */
.start-grid{ display:grid; grid-template-columns:repeat(6,1fr); gap: var(--space-4); }
.start-card{ position:relative; border-radius: var(--radius-lg); overflow:hidden; aspect-ratio: 3/3.6; text-decoration:none; display:flex; }
.start-card img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transition: transform var(--dur-slow) var(--ease); }
.start-card::after{ content:""; position:absolute; inset:0; background: linear-gradient(180deg, rgba(14,26,40,.15) 0%, rgba(14,26,40,.85) 100%); }
.start-card:hover img{ transform: scale(1.06); }
.start-card:hover{ text-decoration:none; }
.start-card-body{ position:relative; z-index:1; margin-top:auto; padding: var(--space-4); color:#fff; }
.start-card-body svg{ width:26px; height:26px; margin-bottom:.6em; color: var(--teal); }
.start-card-body strong{ display:block; font-family:var(--f-display); font-size:var(--fs-md); font-weight:700; }
.start-card-body span{ display:block; font-size:var(--fs-xs); color:#D8E1EE; margin-top:.25em; }

/* ---------- Cards (generic system) ---------- */
.card-grid{ display:grid; gap: var(--space-5); }
.card-grid.cols-3{ grid-template-columns:repeat(3,1fr); }
.card-grid.cols-4{ grid-template-columns:repeat(4,1fr); }
.card-grid.cols-2{ grid-template-columns:repeat(2,1fr); }

.obj-card{ background:#fff; border:1px solid var(--line); border-radius: var(--radius-lg); overflow:hidden; display:flex; flex-direction:column; text-decoration:none; color:inherit; transition: box-shadow var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease); }
.obj-card:hover{ box-shadow: var(--shadow-md); border-color:var(--line-strong); text-decoration:none; transform: translateY(-2px); }
.obj-card .thumb-wrap{ position:relative; aspect-ratio:4/3; background: var(--surface-2); overflow:hidden; flex:none; }
.obj-card .thumb-wrap img{ width:100%; height:100%; object-fit:cover; }
.obj-card .thumb-badges{ position:absolute; top:.7em; left:.7em; display:flex; gap:.4em; flex-wrap:wrap; }
.obj-card .save-btn{ position:absolute; top:.6em; right:.6em; width:38px; height:38px; border-radius:50%; background:rgba(14,26,40,.55); color:#fff; border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; }
.obj-card .save-btn:hover{ background:rgba(14,26,40,.8); }
.obj-card .save-btn svg{ width:18px; height:18px; }
.obj-card .save-btn[aria-pressed="true"] svg{ fill: var(--orange); color:var(--orange); }
.obj-card-body{ padding: var(--space-4); display:flex; flex-direction:column; gap:.5em; flex:1; }
.obj-card-body h3,.obj-card-body h4{ font-size: var(--fs-md); }
.obj-card .obj-meta{ font-size: var(--fs-xs); color: var(--ink-soft); display:flex; flex-wrap:wrap; gap:.5em .9em; align-items:center; }
.obj-card .obj-meta span{ display:inline-flex; align-items:center; gap:.35em; }
.obj-card .obj-meta svg{ width:13px; height:13px; }
.obj-card p.desc{ font-size: var(--fs-sm); color: var(--slate); }
.obj-card-foot{ margin-top:auto; padding-top:.4em; display:flex; align-items:center; justify-content:space-between; gap:.6em; }
.obj-card .price{ font-family:var(--f-display); font-weight:700; color:var(--navy); }
.obj-card-actions{ display:flex; gap:.5em; padding:0 var(--space-4) var(--space-4); }

.story-card .thumb-wrap{ aspect-ratio:16/10; }
.person-card{ text-align:center; }
.person-card .thumb-wrap{ aspect-ratio:1/1; border-radius:50%; width:120px; margin-inline:auto; }
.person-card{ border:none; background:none; }
.person-card:hover{ transform:none; box-shadow:none; }
.person-card .obj-card-body{ align-items:center; text-align:center; }

.related-strip{ display:grid; grid-template-columns:repeat(4,1fr); gap: var(--space-4); }
.related-card{ display:block; text-decoration:none; color:inherit; }
.related-card:hover{ text-decoration:none; }
.related-card .thumb-wrap{ aspect-ratio:4/3; border-radius: var(--radius-md); overflow:hidden; background:var(--surface-2); }
.related-card .thumb-wrap img{ width:100%; height:100%; object-fit:cover; transition: transform var(--dur-med) var(--ease); }
.related-card:hover .thumb-wrap img{ transform:scale(1.05); }
.related-card .rc-body{ padding-top:.6em; }
.related-card strong{ display:block; font-size:var(--fs-sm); color:var(--navy); font-weight:700; }
.related-card span{ display:block; font-size:var(--fs-xs); color:var(--ink-soft); margin-top:.15em; }

/* Featured story */
.featured-story{ display:grid; grid-template-columns:1.1fr 1fr; gap: var(--space-7); align-items:center; background:var(--warm-gray); border-radius: var(--radius-lg); overflow:hidden; }
.featured-story .fs-media{ aspect-ratio:4/3; overflow:hidden; }
.featured-story .fs-media img{ width:100%; height:100%; object-fit:cover; }
.featured-story .fs-body{ padding: var(--space-7) var(--space-7) var(--space-7) 0; }
.featured-story h3{ margin-top:.4em; font-size: var(--fs-xl); }
.featured-story p.desc{ margin-top: var(--space-3); color: var(--ink-soft); }
.featured-story .btn{ margin-top: var(--space-5); }

/* Event rows */
.event-row-list{ display:flex; flex-direction:column; }
.event-row{ display:flex; align-items:center; gap: var(--space-4); padding: var(--space-4) 0; border-bottom:1px solid var(--line); text-decoration:none; color:inherit; }
.event-row:hover{ background:var(--warm-gray); text-decoration:none; margin-inline:-1rem; padding-inline:1rem; border-radius: var(--radius-md); }
.event-row .er-body{ flex:1; min-width:0; }
.event-row .er-body strong{ display:block; font-family:var(--f-display); font-size:var(--fs-md); color:var(--navy); }
.event-row .er-meta{ font-size:var(--fs-xs); color: var(--ink-soft); margin-top:.25em; display:flex; gap:.7em; flex-wrap:wrap; }
.event-row .er-desc{ font-size:var(--fs-sm); color:var(--ink-soft); margin-top:.3em; }
.event-row > svg{ width:18px; height:18px; color: var(--ink-soft); flex:none; }

/* ---------- Category tiles ---------- */
.cat-grid{ display:grid; grid-template-columns:repeat(8,1fr); gap: var(--space-3); }
.cat-tile{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.6em; text-align:center; text-decoration:none;
  color: var(--navy); background:#fff; border:1px solid var(--line); border-radius: var(--radius-lg); padding: var(--space-4) var(--space-2); min-height:132px; }
.cat-tile:hover{ text-decoration:none; border-color: var(--blue); box-shadow: var(--shadow-sm); }
.cat-tile svg{ width:30px; height:30px; color: var(--blue); }
.cat-tile span{ font-weight:700; font-size: var(--fs-sm); }

/* ---------- CTA band / Newsletter ---------- */
.cta-band{ display:flex; align-items:center; justify-content:space-between; gap: var(--space-6); background: var(--navy); color:#fff; border-radius: var(--radius-lg); padding: var(--space-7); flex-wrap:wrap; }
.cta-band h2{ color:#fff; font-size: var(--fs-xl); }
.cta-band p{ color:#C6D3E6; margin-top:.5em; }
.cta-band-actions{ display:flex; gap: var(--space-3); flex-wrap:wrap; }

.newsletter-strip{ background: linear-gradient(90deg, var(--navy) 0%, #0c2138 100%); color:#fff; }
.newsletter-strip .container{ display:flex; align-items:center; gap: var(--space-6); padding-block: var(--space-6); flex-wrap:wrap; }
.newsletter-copy{ display:flex; align-items:center; gap: var(--space-3); flex:1; min-width:260px; }
.newsletter-copy .icon-circle{ width:46px; height:46px; border-radius:50%; background:rgba(255,255,255,.12); display:flex; align-items:center; justify-content:center; flex:none; }
.newsletter-copy .icon-circle svg{ width:22px; height:22px; }
.newsletter-form{ display:flex; gap:.6em; flex:1; min-width:280px; }
.newsletter-form .field{ flex:1; }
.newsletter-form input{ background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.25); color:#fff; }
.newsletter-form input::placeholder{ color:#9FB4CF; }
.newsletter-form .btn-teal{ flex:none; }
.newsletter-msg{ font-size:var(--fs-xs); margin-top:.5em; display:flex; gap:.4em; align-items:flex-start; }
.newsletter-msg.ok{ color:#7CF0C8; }
.newsletter-msg.err{ color:#FFB4AC; }

/* ---------- Footer ---------- */
.site-footer{ background: var(--navy); color:#B9C6DA; }
.footer-top{ padding-block: var(--space-8); display:grid; grid-template-columns: 1.4fr repeat(7,1fr); gap: var(--space-5); }
.footer-brand .brand{ margin-bottom: var(--space-4); }
.footer-brand address{ font-style:normal; font-size:var(--fs-sm); line-height:1.7; }
.footer-brand address a{ color:#B9C6DA; text-decoration:none; }
.footer-brand address a:hover{ color:#fff; text-decoration:underline; }
.footer-social{ display:flex; gap:.6em; margin-top: var(--space-4); }
.footer-col h3{ font-family:var(--f-body); font-size:var(--fs-xs); text-transform:uppercase; letter-spacing:.07em; color:#fff; font-weight:700; margin-bottom:1em; }
.footer-col ul li + li{ margin-top:.55em; }
.footer-col a{ color:#B9C6DA; text-decoration:none; font-size:var(--fs-sm); }
.footer-col a:hover{ color:#fff; text-decoration:underline; }
.footer-bottom{ border-top:1px solid rgba(255,255,255,.1); padding-block: var(--space-5); display:flex; align-items:center; justify-content:space-between; gap: var(--space-4); flex-wrap:wrap; font-size: var(--fs-xs); }
.footer-legal{ display:flex; gap: var(--space-4); flex-wrap:wrap; }
.footer-legal a{ color:#B9C6DA; text-decoration:none; }
.footer-legal a:hover{ color:#fff; }

/* ---------- Filters (sidebar + drawer) ---------- */
.layout-with-filters{ display:grid; grid-template-columns:280px 1fr; gap: var(--space-7); align-items:start; }
.filter-panel{ background:#fff; border:1px solid var(--line); border-radius: var(--radius-lg); padding: var(--space-5); position:sticky; top:calc(var(--header-h) + 1rem); }
.filter-group + .filter-group{ margin-top: var(--space-5); padding-top: var(--space-5); border-top:1px solid var(--line); }
.filter-group-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom: var(--space-3); }
.filter-group-head h3, .filter-group-head h2{ font-size: var(--fs-sm); font-weight:700; color:var(--navy); }
.filter-options{ display:flex; flex-wrap:wrap; gap:.5em; }
.filter-options.stacked{ flex-direction:column; }
.filter-panel .btn-block + .btn-block{ margin-top:.6em; }

.results-toolbar{ display:flex; align-items:center; justify-content:space-between; gap: var(--space-4); flex-wrap:wrap; margin-bottom: var(--space-4); }
.results-count{ font-weight:700; color:var(--navy); font-family:var(--f-display); }
.results-count span{ color: var(--ink-soft); font-family:var(--f-body); font-weight:500; }
.toolbar-actions{ display:flex; align-items:center; gap:.7em; flex-wrap:wrap; }
.view-toggle{ display:flex; border:1.5px solid var(--line-strong); border-radius: var(--radius-md); overflow:hidden; }
.view-toggle button{ background:#fff; border:none; width:42px; height:42px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-soft); }
.view-toggle button + button{ border-left:1.5px solid var(--line-strong); }
.view-toggle button[aria-pressed="true"]{ background: var(--navy); color:#fff; }
.view-toggle svg{ width:18px; height:18px; }

.chip-row{ display:flex; flex-wrap:wrap; gap:.5em; align-items:center; margin-bottom: var(--space-5); }
.chip-row .clear-all{ font-size:var(--fs-xs); font-weight:700; color: var(--blue); background:none; border:none; cursor:pointer; padding:.4em .2em; }

.filter-drawer-trigger{ display:none; }
.filter-drawer{ position:fixed; inset:0; z-index:450; visibility:hidden; }
.filter-drawer.is-open{ visibility:visible; }
.filter-drawer .fd-backdrop{ position:absolute; inset:0; background:rgba(9,15,24,.55); opacity:0; transition: opacity var(--dur-med) var(--ease); }
.filter-drawer.is-open .fd-backdrop{ opacity:1; }
.filter-drawer .fd-sheet{ position:absolute; left:0; right:0; bottom:0; background:#fff; border-radius: 20px 20px 0 0; max-height:86vh; display:flex; flex-direction:column; transform: translateY(100%); transition: transform var(--dur-med) var(--ease); }
.filter-drawer.is-open .fd-sheet{ transform: translateY(0); }
.fd-head{ display:flex; align-items:center; justify-content:space-between; padding: var(--space-4) var(--space-5); border-bottom:1px solid var(--line); flex:none; }
.fd-body{ padding: var(--space-5); overflow-y:auto; }
.fd-foot{ padding: var(--space-4) var(--space-5); border-top:1px solid var(--line); display:flex; gap: var(--space-3); flex:none; }

/* ---------- Pagination ---------- */
.pagination{ display:flex; align-items:center; justify-content:center; gap:.4em; margin-top: var(--space-7); }
.pagination button{ min-width:42px; height:42px; border-radius: var(--radius-md); border:1.5px solid var(--line-strong); background:#fff; color:var(--navy); font-weight:700; cursor:pointer; }
.pagination button:hover{ border-color: var(--blue); }
.pagination button[aria-current="page"]{ background: var(--navy); border-color:var(--navy); color:#fff; }
.pagination button[disabled]{ opacity:.4; cursor:not-allowed; }

/* ---------- States: empty / loading / error ---------- */
.state-block{ text-align:center; padding: var(--space-9) var(--space-5); border:1.5px dashed var(--line-strong); border-radius: var(--radius-lg); }
.state-block .state-icon{ width:56px; height:56px; margin-inline:auto; margin-bottom: var(--space-4); color: var(--ink-soft); }
.state-block h3{ margin-bottom:.5em; }
.state-block p{ color: var(--ink-soft); max-width:46ch; margin-inline:auto; }
.state-block .btn{ margin-top: var(--space-5); }
.state-block.is-error .state-icon{ color: var(--status-bad); }

.skeleton-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap: var(--space-5); }
.skel-card{ border-radius: var(--radius-lg); overflow:hidden; border:1px solid var(--line); }
.skel-thumb{ aspect-ratio:4/3; background: linear-gradient(100deg, var(--surface-2) 30%, #f5f6f8 50%, var(--surface-2) 70%); background-size:220% 100%; animation: shimmer 1.4s ease-in-out infinite; }
.skel-line{ height:12px; background: var(--surface-2); border-radius:6px; margin: var(--space-2) var(--space-4); }
.skel-line.w-60{ width:60%; }
.skel-line.w-40{ width:40%; }
@keyframes shimmer{ 0%{ background-position:200% 0; } 100%{ background-position:-20% 0; } }
@media (prefers-reduced-motion: reduce){ .skel-thumb{ animation:none; background: var(--surface-2); } }

/* ---------- Tabs ---------- */
.tabs{ display:flex; gap: var(--space-2); border-bottom:1px solid var(--line); overflow-x:auto; }
.tab-btn{ background:none; border:none; padding:1em 1.1em; font-weight:700; color: var(--ink-soft); cursor:pointer; border-bottom:3px solid transparent; white-space:nowrap; min-height:44px; }
.tab-btn:hover{ color: var(--navy); }
.tab-btn[aria-selected="true"]{ color: var(--blue); border-color: var(--blue); }

/* ---------- At-a-glance / spec tables ---------- */
.glance-list{ display:flex; flex-direction:column; gap: var(--space-3); }
.glance-list dt{ font-size:var(--fs-xs); text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); font-weight:700; }
.glance-list dd{ margin:0; font-family: var(--f-mono); font-size: var(--fs-sm); color: var(--navy); font-weight:600; }
.glance-row{ display:flex; justify-content:space-between; gap:1em; padding-block:.6em; border-bottom:1px solid var(--line); }
.spec-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap: var(--space-4); }
.spec-item{ background:#fff; border:1px solid var(--line); border-radius: var(--radius-md); padding: var(--space-4); }
.spec-item .k{ display:flex; align-items:center; gap:.5em; font-size:var(--fs-xs); text-transform:uppercase; letter-spacing:.05em; color: var(--ink-soft); font-weight:700; margin-bottom:.5em; }
.spec-item .k svg{ width:16px; height:16px; color: var(--blue); }
.spec-item .v{ font-family: var(--f-mono); font-weight:600; font-size: var(--fs-sm); color:var(--navy); }
.spec-item .v-sub{ font-size:var(--fs-xs); color: var(--ink-soft); margin-top:.2em; }

/* ---------- Gallery ---------- */
.gallery-strip{ display:grid; grid-template-columns:repeat(4,1fr); gap: var(--space-3); }
.gallery-strip button{ position:relative; border:none; padding:0; border-radius: var(--radius-md); overflow:hidden; cursor:pointer; aspect-ratio:4/3; background:var(--surface-2); }
.gallery-strip img{ width:100%; height:100%; object-fit:cover; }
.gallery-caption{ position:absolute; left:0; right:0; bottom:0; background:linear-gradient(0deg, rgba(14,26,40,.85), transparent); color:#fff; font-size:var(--fs-xs); padding:.6em .7em .4em; text-align:left; font-weight:600; }

/* ---------- Program program-finder / hero form panel ---------- */
.finder-panel{ background:#fff; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); border:1px solid var(--line); padding: var(--space-6); margin-top:-4.5rem; position:relative; z-index:5; }
.finder-grid{ display:grid; grid-template-columns:1fr 1fr 1fr auto; gap: var(--space-6); align-items:start; }
.finder-group h3{ font-size: var(--fs-xs); text-transform:uppercase; letter-spacing:.06em; color: var(--ink-soft); font-weight:700; margin-bottom: var(--space-3); }
.finder-actions{ display:flex; align-items:flex-end; height:100%; }
.audience-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap: var(--space-4); }
.audience-card{ border:1.5px solid var(--line); border-radius: var(--radius-lg); overflow:hidden; text-decoration:none; color:inherit; display:flex; flex-direction:column; }
.audience-card:hover{ border-color: var(--blue); text-decoration:none; box-shadow: var(--shadow-sm); }
.audience-card .ac-body{ padding: var(--space-4); border-bottom:3px solid var(--teal); }
.audience-card .ac-body svg{ width:26px; height:26px; color: var(--teal-dark); margin-bottom:.6em; }
.audience-card strong{ display:block; font-family:var(--f-display); font-weight:700; font-size:var(--fs-md); }
.audience-card span{ display:block; font-size:var(--fs-sm); color: var(--ink-soft); margin-top:.3em; }
.audience-card img{ aspect-ratio:16/10; object-fit:cover; }

/* ---------- Sequence / outcomes ---------- */
.outcome-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap: var(--space-4); }
.outcome-card{ background:#fff; border:1px solid var(--line); border-radius: var(--radius-lg); padding: var(--space-5); }
.outcome-card .num{ font-family:var(--f-mono); color: var(--ink-soft); font-size:var(--fs-xs); }
.outcome-card svg{ width:26px; height:26px; color:var(--blue); margin:.5em 0; }
.sequence-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:.5em; overflow-x:auto; padding-bottom:.5em; }
.sequence-step{ display:flex; flex-direction:column; align-items:center; text-align:center; gap:.6em; flex:1; min-width:110px; position:relative; }
.sequence-step .dot{ width:46px; height:46px; border-radius:50%; background: var(--navy-tint); color: var(--blue); display:flex; align-items:center; justify-content:center; font-weight:800; font-family:var(--f-display); }
.sequence-step span{ font-size: var(--fs-xs); font-weight:700; color: var(--navy); }
.sequence-step p{ font-size:var(--fs-xs); color: var(--ink-soft); }
.sequence-row .connector{ flex:0 0 24px; height:2px; background: var(--line-strong); margin-top:23px; }
.included-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:.6em; }
.included-item{ display:flex; gap:.6em; align-items:flex-start; font-size:var(--fs-sm); }

/* ---------- Sessions table ---------- */
.session-row{ display:grid; grid-template-columns: 1.3fr .9fr 1fr .8fr auto; gap: var(--space-4); align-items:center; padding: var(--space-4); border:1px solid var(--line); border-radius: var(--radius-md); }
.session-row + .session-row{ margin-top: var(--space-3); }
.session-row .sr-label{ font-size:var(--fs-xs); color: var(--ink-soft); text-transform:uppercase; letter-spacing:.05em; font-weight:700; display:block; margin-bottom:.2em; }
.session-row .sr-val{ font-weight:700; color:var(--navy); font-family:var(--f-mono); font-size:var(--fs-sm); }

/* ---------- Sticky sidebar quick facts on program/artifact detail ---------- */
.quickfacts{ background:#fff; border:1px solid var(--line); border-radius: var(--radius-lg); padding: var(--space-5); }
.quickfacts .qf-row{ display:flex; gap: var(--space-3); padding:.7em 0; border-bottom:1px solid var(--line); }
.quickfacts .qf-row:last-of-type{ border-bottom:none; }
.quickfacts .qf-row svg{ width:19px; height:19px; color: var(--blue); flex:none; margin-top:.1em; }
.quickfacts .qf-k{ font-size:var(--fs-xs); text-transform:uppercase; letter-spacing:.05em; color: var(--ink-soft); font-weight:700; }
.quickfacts .qf-v{ font-weight:700; color: var(--navy); }
.quickfacts .qf-actions{ display:flex; flex-direction:column; gap:.6em; margin-top: var(--space-4); }

/* ---------- Timeline (Digital exhibit) ---------- */
.exhibit-rail{ position:sticky; top: calc(var(--header-h) + 1rem); display:flex; flex-direction:column; gap:.2em; }
.exhibit-rail a{ display:flex; align-items:center; gap:.7em; padding:.65em .5em; border-radius: var(--radius-sm); text-decoration:none; color: var(--ink-soft); font-weight:600; font-size:var(--fs-sm); border-left:3px solid transparent; }
.exhibit-rail a:hover{ color:var(--navy); text-decoration:none; }
.exhibit-rail a.is-current{ color: var(--blue-dark); border-left-color: var(--blue); background: var(--navy-tint); }
.exhibit-rail .chnum{ font-family:var(--f-mono); font-size:var(--fs-xs); color: var(--ink-soft); flex:none; width:1.6em; }
.exhibit-chapter{ padding-block: var(--space-8); border-bottom:1px solid var(--line); scroll-margin-top: calc(var(--header-h) + 1.5rem); }
.exhibit-chapter:last-child{ border-bottom:none; }
.exhibit-chapter-media{ border-radius: var(--radius-lg); overflow:hidden; aspect-ratio:16/8; margin-bottom: var(--space-5); background: var(--surface-2); }
.exhibit-chapter-media img{ width:100%; height:100%; object-fit:cover; }
.exhibit-progress{ height:4px; background: var(--surface-2); position:sticky; top:var(--header-h); z-index:150; }
.exhibit-progress-bar{ height:100%; background: var(--teal); width:0%; transition:width var(--dur-fast) linear; }
.site-header.is-compact ~ * .exhibit-progress{ top: var(--header-h-compact); }

/* prototype content indicator */
.proto-badge{ display:inline-flex; align-items:center; gap:.4em; font-size:.7rem; font-weight:700; letter-spacing:.03em; color: var(--ink-soft); background: var(--surface-2); padding:.3em .7em; border-radius: var(--radius-pill); }

.proto-banner{ background:#FFF6E5; border-bottom:1px solid #F3D9A0; color:#5B4300; }

.proto-banner svg{ width:18px; height:18px; flex:none; color:#9A6B00; }
.proto-banner button{ margin-left:auto; background:none; border:none; cursor:pointer; color:#5B4300; padding:.3em; flex:none; }
.proto-banner button svg{ width:16px; height:16px; color:#5B4300; }

/* toast / live announce (visually hidden but present) */

/* ---------- Misc content pages (About / Visit / Support) ---------- */
.two-col{ display:grid; grid-template-columns:1.2fr .8fr; gap: var(--space-8); align-items:start; }

.faq-q svg{ width:20px; height:20px; flex:none; transition: transform var(--dur-fast) var(--ease); color: var(--blue); }

.doc-row{ display:flex; align-items:center; gap: var(--space-4); padding: var(--space-4); border:1px solid var(--line); border-radius: var(--radius-md); text-decoration:none; color:inherit; }

<script>
/* ==========================================================================
   RICM PROTOTYPE — PLACEHOLDER PHOTOGRAPHY GENERATOR
   The Artifact CSP allows only same-file data: URIs for images (no external
   photo hosts), and Sec.22 of the master brief calls for clearly-identified
   representative imagery in a prototype anyway. This generates a small,
   deterministic, on-brand SVG "photography placeholder" per seed — a
   gradient tile in the RICM palette with a subtle dot texture and a simple
   glyph — entirely inline, so every image in the prototype renders with no
   network dependency at all.
   ========================================================================== */
(function(){
  "use strict";
  function hashStr(s){ let h = 0; s = String(s); for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) | 0; } return Math.abs(h); }
  const PALETTES = [
    ["#0E1A28","#1168E5"], ["#0E1A28","#00C2B2"], ["#16283b","#7C3AED"],
    ["#0E1A28","#FF8A00"], ["#142B45","#00C2B2"], ["#1e3550","#1168E5"],
    ["#0E1A28","#7C3AED"], ["#16283b","#00C2B2"],
  ];
  const GLYPHS = {
    monitor: (s)=>`<rect x="${-s*.5}" y="${-s*.4}" width="${s}" height="${s*.68}" rx="${s*.05}"/><line x1="0" y1="${s*.28}" x2="0" y2="${s*.46}"/><line x1="${-s*.32}" y1="${s*.46}" x2="${s*.32}" y2="${s*.46}"/>`,
    disc:    (s)=>`<circle r="${s*.5}"/><circle r="${s*.13}"/>`,
    chip:    (s)=>`<rect x="${-s*.32}" y="${-s*.32}" width="${s*.64}" height="${s*.64}" rx="${s*.06}"/><line x1="${-s*.12}" y1="${-s*.32}" x2="${-s*.12}" y2="${-s*.48}"/><line x1="${s*.12}" y1="${-s*.32}" x2="${s*.12}" y2="${-s*.48}"/><line x1="${-s*.12}" y1="${s*.32}" x2="${-s*.12}" y2="${s*.48}"/><line x1="${s*.12}" y1="${s*.32}" x2="${s*.12}" y2="${s*.48}"/><line x1="${-s*.32}" y1="${-s*.12}" x2="${-s*.48}" y2="${-s*.12}"/><line x1="${-s*.32}" y1="${s*.12}" x2="${-s*.48}" y2="${s*.12}"/><line x1="${s*.32}" y1="${-s*.12}" x2="${s*.48}" y2="${-s*.12}"/><line x1="${s*.32}" y1="${s*.12}" x2="${s*.48}" y2="${s*.12}"/>`,
    book:    (s)=>`<path d="M${-s*.42} ${-s*.36} h${s*.38} a${s*.06} ${s*.06} 0 0 1 ${s*.06} ${s*.06} v${s*.6} h-${s*.44}z"/><path d="M${s*.42} ${-s*.36} h-${s*.38} a${s*.06} ${s*.06} 0 0 0 -${s*.06} ${s*.06} v${s*.6} h${s*.44}z"/>`,
    people:  (s)=>`<circle cx="${-s*.16}" cy="${-s*.12}" r="${s*.16}"/><circle cx="${s*.2}" cy="${-s*.06}" r="${s*.11}"/><path d="M${-s*.42} ${s*.42} q0 -${s*.3} ${s*.26} -${s*.3} q${s*.26} 0 ${s*.26} ${s*.3}"/>`,
    gear:    (s)=>`<circle r="${s*.22}"/><circle r="${s*.05}" fill="currentColor" stroke="none"/>${Array.from({length:8}).map((_,i)=>{const a=i*Math.PI/4;return `<line x1="${Math.cos(a)*s*.22}" y1="${Math.sin(a)*s*.22}" x2="${Math.cos(a)*s*.36}" y2="${Math.sin(a)*s*.36}"/>`;}).join("")}`,
  };
  const GLYPH_KEYS = Object.keys(GLYPHS);

  function RICM_PH(seed, w, h){
    w = w||800; h = h||600;
    const hashed = hashStr(seed);
    const [c1,c2] = PALETTES[hashed % PALETTES.length];
    const angle = hashed % 90;
    const glyphKey = GLYPH_KEYS[hashed % GLYPH_KEYS.length];
    const s = Math.min(w,h) * 0.26;
    const uid = "g" + (hashed % 100000);
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="">
<defs>
<linearGradient id="${uid}" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(${angle} .5 .5)">
<stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/>
</linearGradient>
<pattern id="${uid}d" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(${angle})">
<circle cx="2" cy="2" r="1.5" fill="#ffffff" opacity="0.10"/>
</pattern>
</defs>
<rect width="${w}" height="${h}" fill="url(#${uid})"/>
<rect width="${w}" height="${h}" fill="url(#${uid}d)"/>
<g transform="translate(${w/2},${h/2})" fill="none" stroke="#ffffff" stroke-width="${Math.max(2,s*0.045)}" stroke-linecap="round" stroke-linejoin="round" opacity="0.42">${GLYPHS[glyphKey](s)}</g>
</svg>`;
    return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg).replace(/'/g,"%27").replace(/"/g,"%22");
  }
  window.RICM_PH = RICM_PH;
})();
</script>

<script>
/* ==========================================================================
   RICM PROTOTYPE — DATA LAYER
   Written as plain JS objects with JSDoc typedefs so the shapes translate
   mechanically to TypeScript interfaces in a production build (see Sec.34/35
   of the master brief). Kept separate from render/view code below.

   CONTENT PROVENANCE: well-known public facts about real historical
   machines/companies (e.g. Apple IIc specs, IBM/DEC history, storage-media

const DATA_STORAGE_CHAPTERS = [
  {slug:"ibm-punch-card", title:"Punch Cards", era:"1890s–1970s", body:"Adapted from Jacquard looms and Herman Hollerith's census tabulators, punched cards were the primary way to store data and instructions for the first century of automated computing.", relatedArtifact:"ibm-1401", image: img("chap-punchcard",1400,800)},
  {slug:"paper-tape", title:"Paper Tape", era:"1950s–1970s", body:"A continuous strip of paper with rows of punched holes, paper tape stored programs and data more compactly than card decks and could be read faster by teletypes and minicomputers alike.", relatedArtifact:"dec-pdp-8e-sid", image: img("chap-papertape",1400,800)},
  {slug:"ibm-magnetic-tape", title:"Magnetic Tape (Reel-to-Reel)", era:"1950s–1980s", body:"Large reel-to-reel tape drives — the spinning-reel image most people picture when they hear ‘computer’ — offered far higher capacity than cards or paper tape and became the standard for mainframe backup and bulk storage.", relatedArtifact:"ibm-1401", image: img("chap-reeltape",1400,800)},
  {slug:"hard-disk-drives", title:"Hard Disk Drives", era:"1956–present", body:"IBM's RAMAC in 1956 was the first commercial computer with a moving-head hard disk. Early drives were the size of refrigerators and stored a few megabytes; the same principle now underlies drives that fit in a pocket and store trillions of bytes.", relatedArtifact:"", image: img("chap-hdd",1400,800)},
  {slug:"floppy-disc", title:"Floppy Disks", era:"1971–1990s", body:"From the 8-inch floppy IBM introduced for mainframe use to the ubiquitous 5.25-inch and 3.5-inch formats that followed, the floppy disk was how a generation installed software, saved homework, and shared files.", relatedArtifact:"apple-iic", image: img("chap-floppy",1400,800)},
  {slug:"diskettes", title:"Diskettes (3.5″)", era:"1982–2000s", body:"Sony's rigid 3.5-inch diskette, protected by a sliding metal shutter, replaced the more fragile 5.25-inch floppy as the dominant removable format through the 1990s.", relatedArtifact:"", image: img("chap-diskette",1400,800)},
  {slug:"bubble-memory", title:"Bubble Memory", era:"1970s–1980s", body:"A short-lived non-volatile memory technology that stored data as tiny magnetized ‘bubbles’ moving through a thin magnetic film — promising but ultimately eclipsed by falling flash and disk prices.", relatedArtifact:"", image: img("chap-bubble",1400,800)},
  {slug:"bernoulli-box", title:"Bernoulli Box", era:"1980s–1990s", body:"Iomega's removable-cartridge drive used the Bernoulli effect to keep flexible media stable at high speed, offering far more capacity than a floppy in a durable cartridge.", relatedArtifact:"", image: img("chap-bernoulli",1400,800)},
  {slug:"laserdisc", title:"LaserDisc", era:"1978–1990s", body:"An early consumer optical video format storing analog video on a 12-inch reflective disc — a direct ancestor of the CD and DVD formats that followed.", relatedArtifact:"", image: img("chap-laserdisc",1400,800)},
  {slug:"compact-discs", title:"Compact Discs", era:"1982–present", body:"Developed jointly by Sony and Philips, the CD brought digital optical storage to the mass market — first for music, then, as the CD-ROM, for software and data.", relatedArtifact:"", image: img("chap-cd",1400,800)},
  {slug:"zip-drive", title:"Zip Drive", era:"1994–2000s", body:"Iomega's Zip disk offered roughly 100 MB in a format barely larger than a floppy, briefly becoming the standard for moving large files before recordable CDs and USB drives took over.", relatedArtifact:"", image: img("chap-zip",1400,800)},
  {slug:"jaz-drive", title:"Jaz Drive", era:"1995–1990s", body:"Iomega's higher-capacity, hard-disk-based sibling to the Zip drive, aimed at power users and creative professionals moving very large files.", relatedArtifact:"", image: img("chap-jaz",1400,800)},
  {slug:"t-10000-magnetic-tape", title:"Modern Tape Cartridges (T10000-class)", era:"2000s–present", body:"Contrary to popular belief, tape never disappeared — modern cartridge formats remain a cornerstone of enterprise backup and archival storage, holding many terabytes per cartridge at low cost per gigabyte.", relatedArtifact:"", image: img("chap-t10000",1400,800)},
  {slug:"audio-cassette-tapes", title:"Audio Cassette Tapes", era:"1970s–1990s", body:"Long before it became a music format, the humble compact cassette was a genuinely popular — if painfully slow — way to load programs into early home computers like the TRS-80 and ZX81.", relatedArtifact:"trs-80", image: img("chap-cassette",1400,800)},
  {slug:"sd-memory", title:"SD Memory Cards", era:"1999–present", body:"Secure Digital cards miniaturized flash storage into a format small enough for cameras, phones, and eventually nearly every portable device.", relatedArtifact:"", image: img("chap-sd",1400,800)},
  {slug:"usb-flash-drive", title:"USB Flash Drives", era:"2000–present", body:"The USB flash drive replaced the floppy disk as the default way to physically carry files from one computer to another — durable, tiny, and, for a while, a promotional-giveaway staple.", relatedArtifact:"", image: img("chap-usb",1400,800)},
  {slug:"ssds", title:"Solid State Drives", era:"2000s–present", body:"Solid state drives replaced spinning platters with flash memory entirely, trading a little cost-per-gigabyte for enormous gains in speed, durability, and power efficiency — now standard in most new computers.", relatedArtifact:"", image: img("chap-ssd",1400,800)},
];

const routes = []; // {test(path)->params|null, render(params, query)}
function registerRoute(pattern, render){
  const paramNames = [];
  const rx = new RegExp("^" + pattern.replace(/:[^/]+/g, (m)=>{ paramNames.push(m.slice(1)); return "([^/]+)"; }) + "/?$");
  routes.push({ rx, paramNames, render });
}
function matchRoute(path){
  for(const r of routes){
    const m = r.rx.exec(path);
    if(m){
      const params = {};
      r.paramNames.forEach((n,i)=> params[n] = decodeURIComponent(m[i+1]));
      return { render: r.render, params };
    }
  }
  return null;
}
function parseHash(){
  let hash = location.hash.replace(/^#/, "");
  if(!hash) hash = "/";
  const [path, queryStr] = hash.split("?");
  const query = {};
  if(queryStr) new URLSearchParams(queryStr).forEach((v,k)=>{ query[k] = v; });
  return { path: path || "/", query };
}
function buildHash(path, query){
  const qs2 = query && Object.keys(query).length ? "?" + new URLSearchParams(query).toString() : "";
  return "#" + path + qs2;
}
function navigate(path, query){ location.hash = buildHash(path, query||{}); }

let scrollLock = 0;
function lockScroll(){ scrollLock++; document.body.style.overflow = "hidden"; }
function unlockScroll(){ scrollLock = Math.max(0,scrollLock-1); if(scrollLock===0) document.body.style.overflow = ""; }

/* focus trap for dialogs */
function trapFocus(container, e){
  const focusables = qsa('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])', container).filter(el=>el.offsetParent!==null);
  if(!focusables.length) return;
  const first = focusables[0], last = focusables[focusables.length-1];
  if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
}

function scoreMatch(hay, q){ return hay.toLowerCase().includes(q.toLowerCase()); }
function runGlobalSearch(q){
  q = q.trim();
  if(!q) return null;
  const out = {Artifacts:[], Stories:[], Programs:[], Events:[]};
  D.ARTIFACTS.forEach(a=>{ if(scoreMatch(a.name+" "+a.manufacturer, q)) out.Artifacts.push({title:a.name, sub:`${a.year} · ${a.manufacturer}`, href:`/collection/${a.slug}`, image:a.images[0]}); });
  D.STORIES.forEach(s=>{ if(scoreMatch(s.title+" "+s.summary, q)) out.Stories.push({title:s.title, sub:s.storyType, href:`/stories/${s.slug}`, image:s.image}); });
  D.PROGRAMS.forEach(p=>{ if(scoreMatch(p.title, q)) out.Programs.push({title:p.title, sub:`Ages ${p.ageRange}`, href:`/programs/${p.slug}`, image:p.image}); });
  D.EVENTS.forEach(ev=>{ if(scoreMatch(ev.title, q)) out.Events.push({title:ev.title, sub:formatDate(ev.date), href:`/events`, image:ev.image}); });
  return out;
}

/* ---------------- Pagination ---------------- */
function paginationHtml(page, totalPages){
  if(totalPages<=1) return "";
  let btns = "";
  const add = (p,label,current,disabled)=> btns += `<button type="button" data-page="${p}" ${current?'aria-current="page"':''} ${disabled?'disabled':''} aria-label="${label||('Page '+p)}">${label||p}</button>`;
  add(Math.max(1,page-1), "‹ Prev", false, page===1);
  const windowSize=1;
  for(let p=1;p<=totalPages;p++){
    if(p===1||p===totalPages||Math.abs(p-page)<=windowSize) add(p,null,p===page,false);
    else if(p===2||p===totalPages-1) btns += `<span style="padding:0 .3em;color:var(--ink-soft);">…</span>`;
  }
  add(Math.min(totalPages,page+1), "Next ›", false, page===totalPages);
  return `<nav class="pagination" aria-label="Pagination">${btns}</nav>`;
}
function wirePagination(container, onGoto){
  qsa("[data-page]", container).forEach(b=> b.addEventListener("click", ()=> onGoto(parseInt(b.dataset.page,10))));
}

    <form class="newsletter-form" id="newsletter-form" novalidate>
      <div class="field">
        <label for="newsletter-email" class="visually-hidden">Email address</label>
        <input type="email" id="newsletter-email" class="input" placeholder="Your email address" required aria-describedby="newsletter-msg">
        <div id="newsletter-msg"></div>
      </div>
      <button type="submit" class="btn btn-teal">Sign Up</button>
    </form>
  </div></section>`;
}
function wireNewsletterForm(){
  const form = qs("#newsletter-form");
  if(!form) return;
  form.addEventListener("submit", (e)=>{
    e.preventDefault();
    const input = qs("#newsletter-email");
    const msg = qs("#newsletter-msg");
    const val = input.value.trim();
    const valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val);
    if(!valid){
      msg.innerHTML = `<span class="newsletter-msg err">${icon("alertCircle")} Enter a valid email address, like name@example.com.</span>`;
      input.setAttribute("aria-invalid","true");
      announce("There is a problem with the newsletter form: enter a valid email address.", true);
      input.focus();
      return;
    }
    input.removeAttribute("aria-invalid");
    msg.innerHTML = `<span class="newsletter-msg ok">${icon("check")} Thanks — you're on the list for RICM news and updates.</span>`;
    announce("You're subscribed to RICM news and updates.");
    form.reset();
  });
}

function saved(){ try{ return JSON.parse(localStorage.getItem("ricm_saved_programs")||"[]"); }catch(e){ return []; } }
function toggleSaved(id){
  try{
    let s = saved();
    if(s.includes(id)){ s = s.filter(x=>x!==id); } else { s.push(id); }
    localStorage.setItem("ricm_saved_programs", JSON.stringify(s));
    return s.includes(id);
  }catch(e){ return false; }
}
function wireSaveButtons(root){
  qsa("[data-save-program]", root).forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const isSaved = toggleSaved(btn.dataset.saveProgram);
      btn.setAttribute("aria-pressed", String(isSaved));
      btn.setAttribute("aria-label", isSaved ? "Remove from saved programs" : "Save program");
      announce(isSaved ? "Program saved." : "Program removed from saved list.");
    });
  });
}

    [ [name, name.value.trim().length>0], [email, emailValid], [msg, msg.value.trim().length>0] ].forEach(([field,valid])=>{
      field.closest(".field").classList.toggle("has-error", !valid);
      if(!valid) ok = false;

    const out = R.qs("#contact-form-msg");

    announce("Your message has been sent.");
    form.reset();
  });
}

function csv(v){ return v ? v.split(",").filter(Boolean) : []; }
function toggleInList(list, val){ return list.includes(val) ? list.filter(x=>x!==val) : [...list, val]; }

function filterArtifacts(q){
  let items = D.ARTIFACTS.slice();
  const categories = csv(q.category), eras = csv(q.era), manufacturers = csv(q.manufacturer), statuses = csv(q.status);
  const kw = (q.q||"").trim().toLowerCase();
  if(categories.length) items = items.filter(a=>categories.includes(a.category));
  if(eras.length) items = items.filter(a=>eras.includes(a.era));
  if(manufacturers.length) items = items.filter(a=>manufacturers.includes(a.manufacturerId));
  if(statuses.length) items = items.filter(a=>statuses.includes(a.status));
  if(kw) items = items.filter(a => (a.name+" "+a.manufacturer+" "+a.summary).toLowerCase().includes(kw));
  const sort = q.sort || "featured";
  if(sort==="year-asc") items.sort((a,b)=>a.year-b.year);
  else if(sort==="year-desc") items.sort((a,b)=>b.year-a.year);
  else if(sort==="name") items.sort((a,b)=>a.name.localeCompare(b.name));
  return items;
}

function pageCollectionList(params, query){
  const PAGE_SIZE = 9;

    csv(q.category).forEach(v=>chips.push({key:"category:"+v, label:D.CATEGORIES.find(c=>c.id===v)?.label||v}));
    csv(q.manufacturer).forEach(v=>{ const o=D.ORGANIZATIONS.find(o=>o.id===v); chips.push({key:"manufacturer:"+v, label:o?o.name.split(",")[0].split(" (")[0]:v}); });

  }

    const items = filterArtifacts(q);
    const totalPages = Math.max(1, Math.ceil(items.length/PAGE_SIZE));
    const curPage = Math.min(page, totalPages);

    return {items, totalPages, curPage, pageItems};

      <div class="layout-with-filters">

          <div class="filter-group-head"><h2 style="font-size:var(--fs-md);">Filters</h2><button type="button" class="btn-ghost btn-sm" id="collection-clear" style="font-weight:700;">Reset</button></div>
          <div id="collection-filter-groups">${collectionFilterGroupsHtml(query)}</div>
        </aside>
        <div>
          <div class="results-toolbar">
            <button type="button" class="btn btn-outline btn-sm filter-drawer-trigger" id="collection-filter-trigger">${icon("filter")} Filters <span id="collection-filter-count-badge"></span></button>
            <div class="results-count" id="collection-results-count"></div>
            <div class="toolbar-actions">
              <label class="visually-hidden" for="collection-sort">Sort</label>
              <select class="select" id="collection-sort" style="min-height:42px;">
                <option value="featured" ${(!query.sort||query.sort==="featured")?"selected":""}>Sort: Featured</option>
                <option value="year-desc" ${query.sort==="year-desc"?"selected":""}>Newest First</option>
                <option value="year-asc" ${query.sort==="year-asc"?"selected":""}>Oldest First</option>
                <option value="name" ${query.sort==="name"?"selected":""}>Name (A–Z)</option>
              </select>
            </div>
          </div>
          <div id="collection-chip-row"></div>
          <div id="collection-results">${loadingSkeleton(6,3)}</div>
        </div>
      </div>
    </div></section>
  `;

  function render(q, announceChange){
    const {items,totalPages,curPage,pageItems} = buildBody(q);
    qs("#collection-results-count").innerHTML = `${items.length} <span>object${items.length===1?'':'s'} found</span>`;
    qs("#collection-chip-row").innerHTML = chipRow(activeChips(q));
    const badge = qs("#collection-filter-count-badge");
    const activeCount = activeChips(q).length;
    if(badge) badge.textContent = activeCount ? `(${activeCount})` : "";
    const results = qs("#collection-results");
    if(items.length===0){
      results.innerHTML = emptyState("No objects match your filters", "Try removing a filter or searching a different term — or browse the full collection.", "Clear Filters");
      qs("[data-empty-cta]", results)?.addEventListener("click", ()=> setQuery({}));
    } else {
      results.innerHTML = `<div class="card-grid cols-3">${pageItems.map(artifactCard).join("")}</div>${paginationHtml(curPage,totalPages)}`;
      wirePagination(results, (p)=> setQuery(Object.assign({}, q, {page:String(p)})));
    }
    if(announceChange) announce(`${items.length} objects found.`);
  }

  function setQuery(newQ){
    Object.keys(newQ).forEach(k=>{ if(newQ[k]==="" || newQ[k]==null) delete newQ[k]; });
    navigate("/collection", newQ);
  }

  function wireFilterInputs(container, getQ){
    qsa('[data-filter]', container).forEach(input=>{
      input.addEventListener("change", ()=>{
        const q = Object.assign({}, getQ());
        const key = input.dataset.filter;
        let list = csv(q[key]);
        list = toggleInList(list, input.value);
        q[key] = list.join(",");
        setQuery(q);
      });
    });
  }

  return { html, after(root){
    let q = Object.assign({}, query);
    // simulate a brief loading state on first paint for realism, then render results
    window.setTimeout(()=> render(q, false), 260);

    R.qs("#collection-search").addEventListener("input", R.debounce((e)=>{ setQuery(Object.assign({}, q, {q:e.target.value, page:undefined})); }, 400));
    R.qs("#collection-sort").addEventListener("change", (e)=> setQuery(Object.assign({}, q, {sort:e.target.value})));
    R.qs("#collection-clear").addEventListener("click", ()=> setQuery({}));
    wireFilterInputs(qs("#collection-filter-groups"), ()=>q);

    R.qs("#collection-filter-trigger").addEventListener("click", ()=>{
      R.openFilterDrawer(collectionFilterGroupsHtml(q), (body)=> wireFilterInputs(body, ()=>q),
        ()=>{}, ()=> setQuery({q:q.q}));
    });

    root.addEventListener("click", (e)=>{
      const rm = e.target.closest("[data-chip-remove]");
      if(rm){
        const [key,val] = rm.dataset.chipRemove.split(":");
        const q2 = Object.assign({}, q);
        if(key==="q"){ delete q2.q; }
        else { q2[key] = csv(q2[key]).filter(v=>v!==val).join(","); }
        setQuery(q2);
      }
      if(e.target.closest("[data-chip-clear]")) setQuery({});
    });
  }};
}

function page404(path){
  const html = `
    <section class="hero short" data-surface="dark">
      <div class="hero-media"><img src="${window.RICM_PH('page-not-found',1600,600)}" alt=""></div>
      <div class="container hero-inner split-narrow">
        <div>

          <h1>We couldn't find that page</h1>
          <p class="lede">${esc(path)} may have moved as part of RICM's redesign. Try searching, or jump to one of the sections below.</p>
        </div>
      </div>
    </section>
    <section class="section-pad bg-white"><div class="container">
      ${errorState("Page not found", "The page you're looking for doesn't exist at this address — it may have been renamed or reorganized.", "Go to Homepage")}
      <div class="card-grid cols-4" style="margin-top:var(--space-8);">
        ${[["Explore the Collection","/collection","compass"],["Stories & History","/stories","book"],["Program Catalog","/programs","graduationCap"],["Plan Your Visit","/visit","pin"]].map(([t,href,ic])=>`<a class="support-tile" href="#${href}" data-route-link>${icon(ic)}<h3 style="font-size:var(--fs-md);">${t}</h3><span class="text-link">Go ${icon("arrowRight")}</span></a>`).join("")}
      </div>
    </div></section>`;
  return { html, after(root){ qs("[data-retry-cta]", root)?.addEventListener("click", ()=> navigate("/")); } };
}

Object.assign(window.RICM, { pageCollectionList, pageCollectionDetail, page404, csv, toggleInList, collectionFilterGroupsHtml, filterArtifacts });
})();
</script>

<script>

(function(){

const D = window.RICM_DATA, R = window.RICM;
const {qs,qsa,esc,icon,breadcrumb,storyCard,relatedCard,paginationHtml,wirePagination,chipRow,
  emptyState,loadingSkeleton,navigate,announce,csv,toggleInList} = R;

const STORY_TYPES = ["Person","Company","Innovation","Artifact","Restoration","Community","Personal History"];

function filterStories(q){
  let items = D.STORIES.slice();
  const eras = csv(q.era), types = csv(q.type), topics = csv(q.topic);
  const kw = (q.q||"").trim().toLowerCase();
  if(eras.length) items = items.filter(s=>eras.includes(s.era));
  if(types.length) items = items.filter(s=>types.includes(s.storyType));
  if(topics.length) items = items.filter(s=>s.topics.some(t=>topics.includes(t)));
  if(kw) items = items.filter(s => (s.title+" "+s.summary+" "+s.topics.join(" ")).toLowerCase().includes(kw));
  return items;
}
function allTopics(){ const set = new Set(); D.STORIES.forEach(s=>s.topics.forEach(t=>set.add(t))); return Array.from(set).sort(); }

function storiesFilterGroupsHtml(q){
  const eras = csv(q.era), types = csv(q.type), topics = csv(q.topic);
  return `
    <div class="filter-group"><div class="filter-group-head"><h3>Content Type</h3></div>
      <div class="filter-options stacked">${STORY_TYPES.map(t=>`<label class="check-row"><input type="checkbox" data-filter="type" value="${esc(t)}" ${types.includes(t)?'checked':''}> ${esc(t)}</label>`).join("")}</div>
    </div>
    <div class="filter-group"><div class="filter-group-head"><h3>Era</h3></div>
      <div class="filter-options stacked">${D.ERAS.map(e=>`<label class="check-row"><input type="checkbox" data-filter="era" value="${e.id}" ${eras.includes(e.id)?'checked':''}> ${esc(e.label)}</label>`).join("")}</div>
    </div>
    <div class="filter-group"><div class="filter-group-head"><h3>Topic</h3></div>
      <div class="filter-options">${allTopics().map(t=>`<label class="pill" style="cursor:pointer;"><input type="checkbox" data-filter="topic" value="${esc(t)}" ${topics.includes(t)?'checked':''} class="visually-hidden"> ${esc(t)}</label>`).join("")}</div>
    </div>`;
}

function pageStoriesList(params, query){

  const companies = D.ORGANIZATIONS.slice(0,6);
  const popularTopics = allTopics().slice(0,8);

  function activeChips(q){
    const chips = [];

        ${popularTopics.map(t=>`<button type="button" class="pill" data-topic-quick="${esc(t)}" aria-pressed="${csv(query.topic).includes(t)}">${esc(t)}</button>`).join("")}
      </div>
    </div></section>

    <section class="section-pad-sm bg-warm"><div class="container">
      <div class="featured-story">
        <div class="fs-media"><img src="${featured.image}" alt=""></div>
        <div class="fs-body">
          <span class="eyebrow c-purple">Featured Story · ${esc(featured.storyType)}</span>
          <h3>${esc(featured.title)}</h3>

        <a class="create-tile" href="#/collection#era" data-route-link style="aspect-ratio:3/2;"><img src="${window.RICM_PH('browse-eras',700,500)}" alt=""><div class="ct-body">${icon("calendar")}<strong>Eras</strong><span>Travel through time and key moments</span></div></a>
        <a class="create-tile" href="#/exhibits/data-storage" data-route-link style="aspect-ratio:3/2;"><img src="${window.RICM_PH('browse-tech',700,500)}" alt=""><div class="ct-body">${icon("chip")}<strong>Technologies</strong><span>Dive into the innovations that changed everything</span></div></a>
      </div>

  function render(q, doAnnounce){

    const curPage = Math.min(page, totalPages);
    const pageItems = items.slice((curPage-1)*PAGE_SIZE, curPage*PAGE_SIZE);
    qs("#stories-results-count").innerHTML = `${items.length} <span>stor${items.length===1?'y':'ies'} found</span>`;
    qs("#stories-chip-row").innerHTML = chipRow(activeChips(q));
    const results = qs("#stories-results");
    if(items.length===0){
      results.innerHTML = emptyState("No stories match your filters", "Try a different topic, era, or keyword — or clear your filters to see the full library.", "Clear Filters");
      qs("[data-empty-cta]", results)?.addEventListener("click", ()=> setQuery({}));
    } else {
      results.innerHTML = `<div class="card-grid cols-3">${pageItems.map(storyCard).join("")}</div>${paginationHtml(curPage,totalPages)}`;
      wirePagination(results, (p)=> setQuery(Object.assign({}, q, {page:String(p)})));

  function wireFilterInputs(container, getQ){

      input.addEventListener("change", ()=>{
        const q = Object.assign({}, getQ());
        let list = csv(q[input.dataset.filter]);

        q[input.dataset.filter] = list.join(",");

  return { html, after(root){
    let q = Object.assign({}, query);
    window.setTimeout(()=> render(q,false), 220);
    R.qs("#stories-search").addEventListener("input", R.debounce((e)=> setQuery(Object.assign({}, q, {q:e.target.value, page:undefined})), 400));

    wireFilterInputs(qs("#stories-filter-groups"), ()=>q);
    qsa("[data-topic-quick]", root).forEach(b=> b.addEventListener("click", ()=>{

/* ---------------- DIGITAL EXHIBIT: Evolution of Data Storage ---------------- */
function pageExhibitDataStorage(params){
  const chapters = D.DATA_STORAGE_CHAPTERS;
  const activeSlug = params && params.chapter;
  const html = `

      <div class="hero-media"><img src="${window.RICM_PH('exhibit-storage-hero',1600,900)}" alt=""></div>

        </nav>
        <div id="exhibit-chapters">
          ${chapters.map((c,i)=>`
            <article class="exhibit-chapter" id="chapter-${c.slug}" data-chapter-section="${c.slug}">
              <span class="eyebrow c-teal">Chapter ${i+1} of ${chapters.length} · ${esc(c.era)}</span>

              ${c.relatedArtifact ? (()=>{ const ra = D.ARTIFACTS.find(a=>a.id===c.relatedArtifact); return ra ? `<a class="related-card" style="max-width:260px;margin-top:var(--space-5);" href="#/collection/${ra.slug}" data-route-link><div class="thumb-wrap"><img src="${ra.images[0]}" alt=""></div><div class="rc-body"><strong>${esc(ra.name)}</strong><span>See this object in the collection ${'→'}</span></div></a>` : ""; })() : ""}

  `;
  const activeChapter = activeSlug ? chapters.find(c=>c.slug===activeSlug) : null;
  return { html,
    title: activeChapter ? `${activeChapter.title} — Evolution of Data Storage — RICM` : "The Evolution of Data Storage — RICM Digital Exhibit",
    description: activeChapter ? activeChapter.body : "A chapter-based digital exhibit tracing data storage from punch cards to solid state drives.",
    after(root){
    // scrollspy: highlight current rail item + update progress bar; honors reduced motion via CSS smooth-scroll override
    const sections = qsa("[data-chapter-section]", root);
    const railLinks = qsa("[data-chapter-link]", root);
    function onScroll(){
      const scrollTop = window.scrollY, docH = document.documentElement.scrollHeight - window.innerHeight;
      const bar = R.qs("#exhibit-progress-bar"); if(bar && docH>0) bar.style.width = Math.min(100, Math.max(0,(scrollTop/docH)*100)) + "%";
      let current = sections[0];
      const headerH = 100;
      sections.forEach(sec=>{ if(sec.getBoundingClientRect().top - headerH <= 0) current = sec; });
      railLinks.forEach(a=> a.classList.toggle("is-current", current && a.dataset.chapterLink===current.dataset.chapterSection));
    }
    window.addEventListener("scroll", onScroll, {passive:true});
    onScroll();
    if(activeSlug){
      const target = R.qs("#chapter-"+activeSlug, root);
      if(target) window.setTimeout(()=> target.scrollIntoView({behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? "auto":"smooth", block:"start"}), 50);
    }
    root.__cleanup = ()=> window.removeEventListener("scroll", onScroll);
  }};
}

Object.assign(window.RICM, { pageStoriesList, pageStoryDetail, pageExhibitDataStorage, filterStories, storiesFilterGroupsHtml });
})();
</script>

function ageBandMatches(program, bandId){
  const band = D.AGE_BANDS.find(b=>b.id===bandId);
  if(!band) return false;
  return program.ages.some(a=>a>=band.min && a<=band.max);
}
function filterPrograms(q){
  let items = D.PROGRAMS.slice();
  const ages = csv(q.age), interests = csv(q.interest), locations = csv(q.location);
  const kw = (q.q||"").trim().toLowerCase();
  if(ages.length) items = items.filter(p=>ages.some(a=>ageBandMatches(p,a)));
  if(interests.length) items = items.filter(p=>p.interests.some(i=>interests.includes(i)));
  if(locations.length) items = items.filter(p=>p.locationFormats.some(l=>locations.includes(l)));
  if(q.availability==="1") items = items.filter(p=>p.registrationStatus==="open"||p.registrationStatus==="limited");
  if(kw) items = items.filter(p=>(p.title+" "+p.summary+" "+p.interests.join(" ")).toLowerCase().includes(kw));
  const sort = q.sort||"featured";
  if(sort==="price-asc") items.sort((a,b)=>a.price-b.price);
  else if(sort==="price-desc") items.sort((a,b)=>b.price-a.price);
  else if(sort==="age") items.sort((a,b)=>a.ages[0]-b.ages[0]);
  else if(sort==="start-date") items.sort((a,b)=> (a.sessions[0]?.dateRange||"").localeCompare(b.sessions[0]?.dateRange||""));
  return items;
}

function pageProgramsList(params, query){

  function activeChips(q){

    csv(q.interest).forEach(v=>chips.push({key:"interest:"+v, label:D.INTERESTS.find(i=>i.id===v)?.label||v}));
    csv(q.location).forEach(v=>chips.push({key:"location:"+v, label:R.LOCATION_LABEL(v)}));

    if(q.q) chips.push({key:"q", label:`“${q.q}”`});

  }
  function setQuery(newQ){ Object.keys(newQ).forEach(k=>{ if(!newQ[k]) delete newQ[k]; }); navigate("/programs", newQ); }

  const html = `
    <section class="hero short" data-surface="dark">

      <div class="container hero-inner split-narrow">
