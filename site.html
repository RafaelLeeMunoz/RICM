          </div>
        </div>
      </div>
    </section>
    <section class="section-pad bg-white"><div class="container">
      <div class="layout-with-filters">
        <aside class="filter-panel" aria-label="Program filters">
          <div class="filter-group-head"><h2 style="font-size:var(--fs-md);">Refine Your Search</h2><button type="button" class="btn-ghost btn-sm" id="programs-clear" style="font-weight:700;">Reset</button></div>
          <div id="programs-filter-groups">${programsFilterGroupsHtml(query)}</div>
        </aside>
        <div>
          <div class="results-toolbar">
            <button type="button" class="btn btn-outline btn-sm filter-drawer-trigger" id="programs-filter-trigger">${icon("filter")} Filters</button>
            <div class="results-count" id="programs-results-count"></div>
            <div class="toolbar-actions">
              <label class="visually-hidden" for="programs-sort">Sort</label>
              <select class="select" id="programs-sort" style="min-height:42px;">
                <option value="featured" ${(!query.sort||query.sort==="featured")?"selected":""}>Sort: Featured</option>
                <option value="start-date" ${query.sort==="start-date"?"selected":""}>Start Date (Soonest)</option>
                <option value="age" ${query.sort==="age"?"selected":""}>Age (Youngest First)</option>
                <option value="price-asc" ${query.sort==="price-asc"?"selected":""}>Price (Low to High)</option>

                <button type="button" data-view="grid" aria-pressed="${view==='grid'}" aria-label="Grid view">${icon("grid")}</button>

  function programListRow(p, isSaved){
    return `<div class="obj-card" style="flex-direction:row;align-items:stretch;">
      <a href="#/programs/${p.slug}" data-route-link style="width:220px;flex:none;"><div class="thumb-wrap" style="height:100%;aspect-ratio:auto;"><img src="${p.image}" alt="" loading="lazy"></div></a>

  function render(q, doAnnounce){
    const items = filterPrograms(q);
    const totalPages = Math.max(1, Math.ceil(items.length/PAGE_SIZE));
    const curPage = Math.min(page, totalPages);
    const pageItems = items.slice((curPage-1)*PAGE_SIZE, curPage*PAGE_SIZE);
    qs("#programs-results-count").innerHTML = `${items.length} <span>program${items.length===1?'':'s'} found</span>`;
    qs("#programs-chip-row").innerHTML = chipRow(activeChips(q));
    const results = qs("#programs-results");
    const savedList = R.saved();
    if(items.length===0){
      results.innerHTML = emptyState("No programs match your filters", "Try broadening your age range or interests, or clear filters to browse everything.", "Clear Filters");

    let q = Object.assign({}, query);
    window.setTimeout(()=> render(q,false), 260);

    R.qs("#programs-sort").addEventListener("change", (e)=> setQuery(Object.assign({}, q, {sort:e.target.value})));
    R.qs("#programs-clear").addEventListener("click", ()=> setQuery({}));
    wireFilterInputs(qs("#programs-filter-groups"), ()=>q);
    qsa('[data-view]', root).forEach(btn=> btn.addEventListener("click", ()=> setQuery(Object.assign({}, q, {view: btn.dataset.view}))));
    R.qs("#programs-filter-trigger").addEventListener("click", ()=>{
      R.openFilterDrawer(programsFilterGroupsHtml(q), (body)=> wireFilterInputs(body, ()=>q), ()=>{}, ()=> setQuery({q:q.q}));
    });
    root.addEventListener("click", (e)=>{
      const rm = e.target.closest("[data-chip-remove]");
      if(rm){ const [key,val]=rm.dataset.chipRemove.split(":"); const q2=Object.assign({},q);
        if(key==="q"||key==="availability") delete q2[key]; else q2[key]=csv(q2[key]).filter(v=>v!==val).join(",");
        setQuery(q2); }
      if(e.target.closest("[data-chip-clear]")) setQuery({});
    });
  }};
}

<script>

/* ---------------- EVENTS ---------------- */
function pageEvents(params){

function pageEventDetail(params){
  const ev = D.EVENTS.find(e=>e.slug===params.slug);

      <div class="two-col">

          <div class="qf-row">${icon("users")}<div><div class="qf-k">Audience</div><div class="qf-v">${esc(ev.audience)}</div></div></div>

        </div>

  `;
  return { html, title:`${ev.title} — RICM Events`, description:ev.desc };
}

/* ---------------- SEARCH RESULTS ---------------- */
function pageSearch(params, query){
  const q = (query.q||"").trim();
  const html = `
    <section class="hero short" data-surface="dark">
      <div class="hero-media"><img src="${window.RICM_PH('search-hero',1600,600)}" alt=""></div>
      <div class="container hero-inner split-narrow">

          ${breadcrumb([["Home","/"],["Search Results","#"]])}

          <div class="search-field" style="margin-top:var(--space-6);max-width:520px;">
            ${icon("search")}
            <label for="search-page-input" class="visually-hidden">Search RICM</label>
            <input type="search" id="search-page-input" class="input" value="${esc(q)}" placeholder="Search artifacts, stories, programs, events…">
          </div>
        </div>
      </div>
    </section>
    <section class="section-pad bg-white"><div class="container" id="search-page-results"></div></section>
  `;
  function renderResults(term){
    const out = qs("#search-page-results");
    if(!term){ out.innerHTML = emptyState("Type to search", "Enter a search term above — try an artifact, manufacturer, story topic, or program name.", null); return; }
    out.innerHTML = R.loadingSkeleton(6,3);
    window.setTimeout(()=>{
      const results = R.runGlobalSearch(term);
      const total = Object.values(results).reduce((n,a)=>n+a.length,0);
      if(total===0){ out.innerHTML = emptyState(`No results for "${term}"`, "Try a different spelling or a broader term, or browse the Collection, Stories, and Programs directly.", "Clear Search");
        qs("[data-empty-cta]",out)?.addEventListener("click", ()=>{ qs("#search-page-input").value=""; navigate("/search",{}); });
        announce(`No results for ${term}`);
        return;
      }
      out.innerHTML = Object.entries(results).filter(([,v])=>v.length).map(([type,items])=>`
        <div style="margin-bottom:var(--space-7);">
          <h2 style="margin-bottom:var(--space-4);">${esc(type)} <span style="color:var(--ink-soft);font-weight:500;font-size:var(--fs-md);">(${items.length})</span></h2>
          <div class="card-grid cols-3">${items.map(it=>`<a class="obj-card" href="#${it.href}" data-route-link><div class="thumb-wrap"><img src="${it.image}" alt="" loading="lazy"></div><div class="obj-card-body"><h3 style="font-size:var(--fs-md);">${esc(it.title)}</h3><p class="desc">${esc(it.sub)}</p></div></a>`).join("")}</div>
        </div>`).join("");
      announce(`${total} results for ${term}`);
    }, 350);
  }
  return { html, after(root){
    renderResults(q);
    qs("#search-page-input").addEventListener("input", R.debounce((e)=>{ navigate("/search", {q:e.target.value}); }, 450));
  }};
}

Object.assign(window.RICM, { pageCreate, pageEvents, pageEventDetail, pageSearch });
})();
</script>

<script>
/* ==========================================================================
   RICM PROTOTYPE — ROUTER REGISTRATION, ANALYTICS STUB, BOOT / GLOBAL WIRING
   ========================================================================== */
(function(){
"use strict";
const D = window.RICM_DATA, R = window.RICM;
const {qs, qsa, registerRoute, matchRoute, parseHash, announce} = R;

/* ---- analytics stub (Master Prompt Sec.40): logs named events, no PII ---- */
window.__ricmAnalytics = [];
function trackEvent(name, detail){
  const entry = {name, detail: detail||null, t: Date.now()};
  window.__ricmAnalytics.push(entry);
  if(window.__ricmAnalyticsDebug) console.info("[analytics]", entry);
}
document.addEventListener("click", (e)=>{
  const el = e.target.closest("[data-analytics]");
  if(el){ const [name,detail] = el.dataset.analytics.split(":"); trackEvent(name, detail); }
});

/* ---- route table ---- */
registerRoute("/", ()=> R.pageHome());
registerRoute("/visit", ()=> R.pageVisit());
registerRoute("/explore", ()=> R.pageExplore());
registerRoute("/collection", (params,query)=> R.pageCollectionList(params,query));
registerRoute("/collection/:slug", (params)=> R.pageCollectionDetail(params));
registerRoute("/stories", (params,query)=> R.pageStoriesList(params,query));
registerRoute("/stories/:slug", (params)=> R.pageStoryDetail(params));
registerRoute("/exhibits/data-storage", ()=> R.pageExhibitDataStorage({}));
registerRoute("/exhibits/data-storage/:chapter", (params)=> R.pageExhibitDataStorage(params));
registerRoute("/learn", ()=> R.pageLearn());
registerRoute("/programs", (params,query)=> R.pageProgramsList(params,query));
registerRoute("/programs/:slug", (params)=> R.pageProgramDetail(params));
registerRoute("/create", ()=> R.pageCreate());
registerRoute("/events/archive", ()=> R.pageEvents({archive:true}));
registerRoute("/events", ()=> R.pageEvents({}));
registerRoute("/events/:slug", (params)=> R.pageEventDetail(params));
registerRoute("/about", ()=> R.pageAbout());
registerRoute("/support", ()=> R.pageSupport());
registerRoute("/search", (params,query)=> R.pageSearch(params,query));

const PAGE_TITLES = {
  "/":"RICM: Explore the Past. Build the Future.",
  "/visit":"Plan Your Visit — RICM",
  "/explore":"Explore — RICM",
  "/collection":"Explore the Collection — RICM",
  "/stories":"Stories & History — RICM",
  "/exhibits/data-storage":"The Evolution of Data Storage — RICM Digital Exhibit",
  "/learn":"Learn at RICM — STEM Programs",
  "/programs":"Program Catalog — RICM Learn",
  "/create":"Create — RICM",
  "/events":"Upcoming Events — RICM",
  "/events/archive":"Past Events — RICM",
  "/about":"About RICM",
  "/support":"Support RICM",
  "/search":"Search — RICM",
};

let currentCleanup = null;
let isInitialRender = true;

function closeAllOverlays(){
  R.closeAllMegas();
  if(!qs("#mobile-nav-panel").hidden) R.closeMobileNav();
  if(!qs("#search-overlay").hidden) R.closeSearchOverlay();
  if(!qs("#filter-drawer").hidden) R.closeFilterDrawer();
}

function render(){
  closeAllOverlays();
  if(typeof currentCleanup === "function"){ try{ currentCleanup(); }catch(e){} currentCleanup = null; }

  const {path, query} = parseHash();

  // Prototype legacy-URL redirect handling (Master Prompt Sec.31)
  if(D.REDIRECT_MAP[path]){
    const target = D.REDIRECT_MAP[path];
    announce("This legacy URL has moved — redirecting to its new location.");
    location.replace(R.buildHash(target.split("?")[0], Object.fromEntries(new URLSearchParams(target.split("?")[1]||""))));
    return;
  }

  const match = matchRoute(path);
  const main = qs("#main");
  let result;
  try{
    result = match ? match.render(match.params, query) : R.page404(path);
  }catch(err){
    console.error("Render error:", err);
    result = { html: `<section class="section-pad bg-white"><div class="container">${R.errorState("Something went wrong loading this page", "This section of the prototype hit an unexpected error. Try again, or head back to the homepage.", "Reload")}</div></section>`,
      after(root){ qs("[data-retry-cta]",root)?.addEventListener("click", ()=> location.reload()); } };
  }
  main.innerHTML = result.html;
  if(result.after) result.after(main);
  if(main.__cleanup) currentCleanup = main.__cleanup;

  document.title = result.title || PAGE_TITLES[path] || (match ? "RICM" : "Page Not Found — RICM");
  let metaDesc = qs('meta[name="description"]');
  if(!metaDesc){ metaDesc = document.createElement("meta"); metaDesc.name="description"; document.head.appendChild(metaDesc); }
  metaDesc.content = result.description || "RICM: Explore the past, build the future. The Rhode Island Computer Museum's collection, stories, STEM programs, and events.";
  let canonical = qs('link[rel="canonical"]');
  if(!canonical){ canonical = document.createElement("link"); canonical.rel="canonical"; document.head.appendChild(canonical); }
  canonical.href = "https://www.ricomputermuseum.org" + path;

  window.scrollTo(0,0);
  // Don't steal focus on the very first page load — the skip link should be
  // the first Tab stop, as on any normal page. On subsequent in-app
  // navigations, move focus to the new content (standard SPA a11y pattern).
  if(!isInitialRender){ main.focus({preventScroll:true}); }
  isInitialRender = false;
  R.renderPrimaryNav(R.currentSectionFor(path));
  qsa(".nav-item a, .mnav-top-link").forEach(a=>{});
}

window.addEventListener("hashchange", render);

/* ---- global delegated click handling (route links, demo links) ---- */
document.addEventListener("click", (e)=>{
  const demoLink = e.target.closest('[data-route-link="false"]');
  if(demoLink){
    e.preventDefault();
    announce("This link is a placeholder in the prototype and does not navigate.");
    return;
  }
  const link = e.target.closest("[data-route-link]");
  if(link){
    // allow default hash navigation; just make sure overlays close (handled in render on hashchange)
  }
});

/* ---- sticky header compress ---- */
let lastScrollState = false;
function onWindowScroll(){
  const compact = window.scrollY > 40;
  if(compact !== lastScrollState){
    qs("#site-header").classList.toggle("is-compact", compact);
    lastScrollState = compact;
  }
}
window.addEventListener("scroll", onWindowScroll, {passive:true});

/* ---- skip link ---- */
/* Intercept the click instead of letting href="#main" flow through the hash
   router (which would otherwise interpret "#main" as a route change and
   render a 404). Move focus straight to the main region instead. */
qs(".skip-link").addEventListener("click", (e)=>{
  e.preventDefault();
  qs("#main").focus();
});

/* ---- mobile nav + search + proto banner wiring ---- */
qs("#mobile-menu-btn").addEventListener("click", ()=> R.openMobileNav());
qs("#mobile-menu-close").addEventListener("click", ()=> R.closeMobileNav());
qs("#search-open-btn").addEventListener("click", ()=> R.openSearchOverlay());
qs("#search-close-btn").addEventListener("click", ()=> R.closeSearchOverlay());
qs("#search-overlay").addEventListener("click", (e)=>{ if(e.target.id==="search-overlay") R.closeSearchOverlay(); });
qs("#global-search-input").addEventListener("input", R.debounce((e)=> R.renderSearchOverlayBody(e.target.value), 220));

function proto_key(){ return "ricm_proto_banner_dismissed"; }
(function initProtoBanner(){
  let dismissed = false;
  try{ dismissed = localStorage.getItem(proto_key()) === "1"; }catch(e){}
  const banner = qs("#proto-banner");
  if(!dismissed){ banner.hidden = false; }
  qs("#proto-banner-close").addEventListener("click", ()=>{
    banner.hidden = true;
    try{ localStorage.setItem(proto_key(), "1"); }catch(e){}
  });
})();

/* ---- boot ---- */
try{ document.documentElement.lang = "en"; }catch(e){}
R.renderMobileNav();
R.renderFooter();
render();
})();
</script>
